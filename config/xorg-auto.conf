# SiS671: one X screen, internal LCD plus an optional external VGA.
# MergedFB auto detects outputs at X startup; live hotplug remains unverified.
Section "ServerLayout"
    Identifier "SiS671Auto"
    Screen 0 "LaptopScreen" 0 0
    Option "Xinerama" "false"
EndSection

Section "Device"
    Identifier "SiS671-Auto"
    Driver "sis671"
    BusID "PCI:1:0:0"
    Option "ForceCRT2Type" "LCD"
    Option "EnableSiSCtrl" "true"
    Option "NoAccel" "false"
    Option "UseTiming1366" "no"
    Option "MergedFB" "auto"
    # CRT2 is the laptop LCD; keep it to the left of external CRT1/VGA.
    Option "CRT2Position" "LeftOf"
    Option "MergedXinerama" "true"
    Option "MergedXineramaScreen0" "Left"
EndSection

Section "Monitor"
    Identifier "LaptopLCD"
    HorizSync 30-82
    VertRefresh 50-75
    Option "DPMS"
EndSection

Section "Screen"
    Identifier "LaptopScreen"
    Device "SiS671-Auto"
    Monitor "LaptopLCD"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1280x800" "1024x768" "800x600"
    EndSubSection
EndSection
