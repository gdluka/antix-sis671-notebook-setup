# SiS 771/671 con controlador comunitario para Xorg 21.x.
Section "Device"
    Identifier "Device0"
    Driver "sis671"
    Option "NoAccel" "false"
    Option "UseTiming1366" "no"
EndSection

Section "Monitor"
    Identifier "Monitor0"
    HorizSync 30-82
    # El panel a 60 Hz reduce el trabajo de composición en esta CPU antigua.
    VertRefresh 59-61
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "Device0"
    Monitor "Monitor0"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1280x800" "1024x768" "800x600"
    EndSubSection
EndSection
