# SiS 771/671 con panel 1280x800 y VGA 1366x768 extendido.
Section "ServerLayout"
    Identifier "SiS671DualHead"
    Screen 0 "LaptopScreen" 0 0
    Screen 1 "VGAScreen" RightOf "LaptopScreen"
    Option "Clone" "off"
    Option "Xinerama" "true"
EndSection

Section "Device"
    Identifier "SiS671-LCD"
    Driver "sis671"
    BusID "PCI:1:0:0"
    Screen 0
    Option "ForceCRT1" "true"
    Option "ForceCRT2Type" "LCD"
    Option "EnableSiSCtrl" "true"
    Option "NoAccel" "false"
    Option "UseTiming1366" "no"
EndSection

Section "Device"
    Identifier "SiS671-VGA"
    Driver "sis671"
    BusID "PCI:1:0:0"
    Screen 1
    Option "ForceCRT1" "true"
    Option "ForceCRT2Type" "LCD"
    Option "ForceCRT1VGAAspect" "WIDE"
    Option "UseTiming1366" "true"
    Option "NoAccel" "false"
EndSection

Section "Monitor"
    Identifier "LaptopLCD"
    HorizSync 30-82
    VertRefresh 50-75
    Option "DPMS"
EndSection

Section "Monitor"
    Identifier "ExternalVGA"
    HorizSync 30-70
    VertRefresh 56-75
    Option "DPMS"
EndSection

Section "Screen"
    Identifier "LaptopScreen"
    Device "SiS671-LCD"
    Monitor "LaptopLCD"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1280x800" "1024x768" "800x600"
    EndSubSection
EndSection

Section "Screen"
    Identifier "VGAScreen"
    Device "SiS671-VGA"
    Monitor "ExternalVGA"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1366x768" "1024x768" "800x600"
    EndSubSection
EndSection
